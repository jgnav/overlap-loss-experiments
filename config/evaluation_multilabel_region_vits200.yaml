# iBOT-style multilabel linear probe, matched to the original-iBOT control.
checkpoint: ../output/long_ibot_vit_small/85535_0/checkpoint_source1000_continuation0200.pth
checkpoint_key: teacher
arch: vit_small
datasets_root: /mnt/fast/nobackup/scratch4weeks/jg02228/datasets
classification_manifests: null

# The submitted run uses a generated config with an explicit output_dir so that
# Slurm requeues resume the same probes and reuse compatible completed results.
output_dir: null
result_json: null
seed: 0
multilabel_recipe: ibot
num_workers: 4

wandb_mode: offline
wandb_project: ibot-evaluation
wandb_entity: null
wandb_run_name: region-vits200-multilabel
wandb_run_id: null
wandb_resume: null

# Omitted tasks are disabled. VOC probes use 500 epochs; COCO/VG use 200.
# iBOT ViT-S last-four normalized CLS concatenation, train RRC(224) + flip,
# val Resize(256) + CenterCrop(224), 4 GPUs x 256; SGD momentum 0.9,
# weight decay 0, base LR 0.001 scaled to 0.004, cosine decay.
# Local masked BCE/macro AP adaptation, final-epoch reporting.
# Same settings for both models and all datasets; not an exact CRISP reproduction.
evaluations:
  pascal_voc_1shot: true
  pascal_voc_2shot: true
  pascal_voc_5shot: true
  pascal_voc_multilabel: true
  coco_multilabel: true
  visual_genome_multilabel: true
