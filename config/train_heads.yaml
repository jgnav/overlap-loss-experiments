# Paths
data_path: /mnt/fast/nobackup/scratch4weeks/jg02228/datasets/imagenet/train
initial_checkpoint: checkpoints/ibot_vit_small.pth
output_dir: output/train
# Start a new continuation for the region-composition objective.
# Set this to a checkpoint from this objective only to resume an interrupted run.
resume_checkpoint: null

# Model
arch: vit_small
# Prototype-head topology: true reuses one head for CLS and patch tokens;
# false gives CLS and patch tokens separate heads with identical architecture.
shared_head: false

# Loss and teacher
lambda1: 1.0  # Global CLS loss
lambda2: 1.0  # Masked patch loss
lambda3: 1.0  # Region composition weight; set to 0.0 for pure iBOT.

# Minimum two-view intersection as a fraction of the original image area.
region_min_area: 0.10
# Binary selection: minimum fraction of each patch inside the shared region.
region_patch_threshold: 0.5
# Same uncentered patch-softmax temperature for teacher and student regions.
region_temp: 0.1
momentum_teacher: 0.9995
teacher_temp: 0.07
teacher_patch_temp: 0.07  # Centered teacher targets for ordinary iBOT.

# Training
additional_epochs: 200
gpu_count: 4
batch_size_per_gpu: 64
seed: 0
precision: bf16

# Optimizer and schedules
optimizer: adamw
lr_schedule: cosine
lr: 0.00001
min_lr: 0.000001
warmup_epochs: 0
# The official checkpoint ends at weight decay ~=0.4; do not reset it to 0.04.
weight_decay: 0.4
weight_decay_end: 0.4
# Permanently retain source-equivalent epochs 850, 900, 950, and 1000.
saveckp_freq: 50

# Data loading
num_workers: 10

# Detached epoch diagnostics (same deterministic policy for every condition).
# Sample both unmasked teacher global crops; cap is per rank, per sampled batch.
diagnostic_feature_batches: 1
diagnostic_max_patch_features_per_batch: 4096
# CPU prototype comparisons: at most this many rows x K temporary distances.
diagnostic_prototype_chunk_size: 256

# Fixed online representation probes (opt-in; requires ImageNet and VOC data).
# They snapshot the teacher after every completed epoch divisible by 10 and
# launch a bounded local worker. A null GPU shares the first visible training GPU.
# A GPU ID selects an already allocated local GPU; it does not submit a Slurm job.
online_probes_enabled: true
online_probe_frequency: 5
online_probe_datasets_root: /mnt/fast/nobackup/scratch4weeks/jg02228/datasets
online_probe_imagenet_train_size: 10000
online_probe_imagenet_val_size: 5000
online_probe_voc_train_size: 400
online_probe_voc_val_size: 200
online_probe_k: 20
online_probe_batch_size: 256
online_probe_num_workers: 0
online_probe_max_concurrent_jobs: 1
online_probe_wait_at_exit: false
online_probe_gpu: null

# Weights & Biases
wandb_mode: online  # online, offline, or disabled; online reads .wandb_key at repo root
wandb_project: ibot-imagenet1k
wandb_entity: null
wandb_run_name: null
wandb_run_id: ijypap1p
wandb_resume: must
