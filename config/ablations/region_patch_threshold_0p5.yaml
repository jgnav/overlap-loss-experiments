# Controlled post-pretraining continuation from the full iBOT checkpoint.
# The source student, teacher, projection/prototype heads, and iBOT centers are
# restored, while AdamW moments and any FP16 scaler state are deliberately reset.

# Paths
data_path: /mnt/fast/nobackup/scratch4weeks/jg02228/datasets/imagenet/train
initial_checkpoint: checkpoints/ibot_vit_small.pth
output_dir: output/ablation
resume_checkpoint: null
reset_optimizer: true

# Model
arch: vit_small
register: 0
shared_head: true

# Loss and teacher
lambda1: 1.0
lambda2: 1.0
lambda3: 0.2
ibot_plus_plus: false
koleo_regularizer: false
region_min_area: 0.1
region_patch_threshold: 0.5
region_normalization: centering
# mean, mean_scalar_variance, mean_variance, mean_covariance,
# mean_projected_variance, mean_projected_covariance, swd,
# mean_centered_swd, mean_normalized_swd. Selection/area weights apply first.
region_aggregation: mean
region_temp: 0.07
momentum_teacher: 0.9995
teacher_temp: 0.07
teacher_patch_temp: 0.07

# Fresh post-pretraining stage
additional_epochs: 50
gpu_count: 4
batch_size_per_gpu: 64
seed: 0
# Choose bf16 for supported GPUs, or fp16 to use a GradScaler.
precision: fp16

# Fresh optimizer and schedules
optimizer: adamw
lr_schedule: cosine
lr: 0.00001
min_lr: 0.000001
warmup_epochs: 0
weight_decay: 0.04
weight_decay_end: 0.5
saveckp_freq: 50

# Data loading
num_workers: 10

# Diagnostics
diagnostic_feature_batches: 1
diagnostic_max_patch_features_per_batch: 4096
diagnostic_prototype_chunk_size: 256

# Online: VOC k-NN + linear segmentation and ImageNet 10% CLS k-NN.
# Uses offline protocols; false disables all, frequency is completed epochs.
online_probes_enabled: true
online_probe_frequency: 5
online_probe_datasets_root: /mnt/fast/nobackup/scratch4weeks/jg02228/datasets
online_probe_batch_size: 128
online_probe_num_workers: 0
online_probe_max_concurrent_jobs: 1
online_probe_wait_at_exit: true
online_probe_gpu: null

# Weights & Biases
wandb_mode: online
wandb_project: ibot-imagenet1k
wandb_entity: null
wandb_run_name: null
wandb_run_id: null
wandb_resume: null