# Public-input subset of evaluation.yaml. The three disabled tasks require
# unavailable validation ground truth or ScanNet access.
# Paths are relative to this YAML file; absolute paths and ~ also work.
checkpoint: ../output/ablation/83650_0/checkpoint.pth
checkpoint_key: teacher  # teacher or student
arch: auto              # auto, vit_small, vit_base, vit_large
datasets_root: /mnt/fast/nobackup/scratch4weeks/jg02228/datasets
classification_manifests: null  # null = datasets_root/evaluation_manifests

# Stable directory lets a later Slurm allocation reuse compatible completed
# tasks if the 10-hour job limit interrupts this 19-task run.
output_dir: ../output/evaluation/public-83650-epoch50
result_json: null  # null = output_dir/full_evaluation.json

seed: 0
num_workers: 8
# Evaluations automatically use all GPUs visible through CUDA_VISIBLE_DEVICES.
# Slurm's GPU allocation controls how many devices are visible to the job.
segmentation_batch_size: 128  # Feature extraction only; probe recipes stay fixed.

# Weights & Biases: online reads .wandb_key at the repository root.
wandb_mode: offline  # online, offline, or disabled
wandb_project: ibot-evaluation
wandb_entity: null
wandb_run_name: null
wandb_run_id: null
wandb_resume: null  # null, allow, must, never; requires wandb_run_id when set

# Set each evaluation to true or false. Omitted entries are disabled.
# ImageNet k-NN percentages refer to training banks; all use full validation.
evaluations:
  pascal_voc_knn: true
  pascal_voc_linear: true
  ade20k_knn: true
  ade20k_linear: true
  cityscapes_knn: true
  cityscapes_linear: true
  imagenet_knn: true

  imagenet_knn_1pct: true
  imagenet_knn_100pct: true
  imagenet_linear: true
  pascal_voc_1shot: true
  pascal_voc_2shot: true
  pascal_voc_5shot: true
  pascal_voc_multilabel: true
  coco_multilabel: true
  visual_genome_multilabel: true
  spair_correspondence: true
  navi_correspondence: true
  scannet_correspondence: false
  davis_vos: true
  youtube_vos_vos: false
  mose_vos: false
