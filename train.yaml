# Paths
data_path: dataset/imagenet/train
initial_checkpoint: checkpoints/ibot_vit_small.pth
output_dir: output/train

# Model
arch: vit_small

# Loss and teacher
# CLS and iBOT always use centering + softmax. This selects overlap targets:
# centering reuses the iBOT probabilities; sinkhorn_knopp uses raw overlapping
# patch logits, with 3 SK iterations before area-weighted pooling.
# With lambda3: 0.0, both settings give the same pure iBOT objective (no SK).
centering: centering  # centering or sinkhorn_knopp.
lambda1: 1.0  # Global CLS loss
lambda2: 1.0  # Masked patch loss
lambda3: 0.0  # Constant from the first epoch; set to 0.0 for pure iBOT.

# Minimum two-view intersection as a fraction of the original image area.
region_min_area: 0.10
momentum_teacher: 0.9995
teacher_temp: 0.07
teacher_patch_temp: 0.07  # Also the epsilon for the independent overlap SK branch.

# Training
additional_epochs: 200
gpu_count: 4
batch_size_per_gpu: 64
seed: 0
precision: bf16

# Optimizer and schedules
optimizer: adamw
lr_schedule: cosine
lr: 0.00001
min_lr: 0.000001
warmup_epochs: 0
# The official checkpoint ends at weight decay ~=0.4; do not reset it to 0.04.
weight_decay: 0.4
weight_decay_end: 0.4
# Permanently retain source-equivalent epochs 850, 900, 950, and 1000.
saveckp_freq: 50

# Data loading
num_workers: 10

# Weights & Biases
wandb_project: ibot-imagenet1k
wandb_entity: null
wandb_run_name: null
